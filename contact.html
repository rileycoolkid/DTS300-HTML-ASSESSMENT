<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=can , initial-scale=1.0">
    <meta name="description" content="Get in touch with Sleep Well.">
    <title>Contact | Sleep Well</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1 class="logo">Sleep Well</h1>
            <nav class="main-nav" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="site-main container">
        <section class="page-heading">
            <p class="eyebrow">Get in touch</p>
            <h2>Contact Sleep Well</h2>
            <p>Placeholder</p>
        </section>

        <section class="contact-layout">
            <div class="contact-details">
                <h3>Contact details</h3>
                <p>Replace the placeholder information below with your own details.</p>
                <address>
                    <p><strong>Email:</strong><br><a href="mailto:email@example.com">email@example.com</a></p>
                    <p><strong>Phone:</strong><br><a href="tel:+0000000000">[phone number]</a></p>
                    <p><strong>Location:</strong><br>[town or city]</p>
                </address>
            </div>

            <form class="contact-form" action="#" method="post">
                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>
                </div>
                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-row">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" placeholder="Write your message here" required></textarea>
                </div>
                <button type="submit">Send message</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Sleep Well. For general information only.</p>
        </div>
    </footer>
</body>
</html>
